---
layout: nt2_base
---
<section class="section">
  <div class="container" style="max-width:72ch">
    <p class="muted" style="margin:0 0 .3rem"><a href="/news-testing-2/" style="color:inherit">&larr; All news</a></p>
    <p class="eyebrow">{{ page.category | default: "Notes" }}</p>
    <h1 style="margin-top:.2rem">{{ page.title }}</h1>
    <p class="muted"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>

    <div class="post-body">
      {{ content }}
    </div>

    <p style="margin-top:2rem"><a class="btn btn-ghost btn-sm" href="/news-testing-2/">&larr; Back to all news</a></p>
  </div>
</section>
